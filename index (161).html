<style>

*{box-sizing:border-box}
html{font-size:var(--fs);scroll-behavior:smooth;scroll-padding-top:4.5rem}

figure svg{width:100%;height:auto;display:block}
figcaption{font-family:system-ui,sans-serif;font-size:.85rem;color:var(--muted);margin-top:.5rem}
.sv-box{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.sv-main{fill:var(--accent);stroke:var(--accent)}
.sv-line{stroke:var(--muted);stroke-width:1.5;fill:none}
.sv-t{fill:var(--ink);font:600 13.5px system-ui,"Noto Sans SC",sans-serif;text-anchor:middle}
.sv-s{fill:var(--muted);font:12.5px system-ui,"Noto Sans SC",sans-serif;text-anchor:middle}
.sv-w{fill:var(--accent-ink);font:600 15px system-ui,"Noto Sans SC",sans-serif;text-anchor:middle}
section{padding-top:2.5rem}
h2{font-size:1.65rem;line-height:1.25;margin:0 0 1rem;padding-bottom:.4rem;border-bottom:1px solid var(--line)}
p{margin:0 0 1rem}
ul.plain{padding-left:1.2rem;margin:0 0 1rem}
ul.plain li{margin-bottom:.5rem}
.def{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:1rem 1.2rem}
table{width:100%;border-collapse:collapse;font-size:.95rem;background:var(--surface);border:1px solid var(--line)}
th,td{text-align:left;vertical-align:top;padding:.6rem .8rem;border-bottom:1px solid var(--line)}

.tw{overflow-x:auto}
.prop{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:1rem 1.2rem;margin-bottom:1rem}
.prop h3{font-size:1.1rem;margin:0 0 .5rem}
.prop h3 b{color:var(--accent);font-family:system-ui,sans-serif;margin-right:.4rem}
.prop p{margin:0 0 .5rem}
.prop .ref{color:var(--muted);font-size:.95rem;margin:0}
.dl{display:grid;gap:.75rem;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));margin-top:1rem}
.dl a{display:block;text-align:center;text-decoration:none;font-family:system-ui,sans-serif;background:var(--accent);color:var(--accent-ink);padding:.8rem 1rem;border-radius:8px;font-weight:600}
.dl a:hover{filter:brightness(1.08)}
.small{font-size:.9rem;color:var(--muted)}
footer{border-top:1px solid var(--line);margin-top:3.5rem;padding-top:1.5rem;font-family:system-ui,sans-serif;font-size:.95rem}
.sig{font-family:"Snell Roundhand","Segoe Script","Brush Script MT",cursive;font-size:1.9rem;margin:0 0 .25rem;color:var(--accent)}
@media (max-width:560px){.bar nav{display:none}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

#content h2{margin-top:2.6rem}
#content h3{font-size:1.2rem;margin:1.8rem 0 .6rem}
#content ol,#content ul{padding-left:1.4rem;margin:0 0 1rem}
#content li{margin-bottom:.5rem}
.nt{border-left:4px solid var(--accent);background:var(--soft);padding:.8rem 1rem;font-family:system-ui,sans-serif;font-size:.95rem}
</style>
